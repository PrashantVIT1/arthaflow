<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 80" width="400" height="80">
  <!-- Icon -->
  <g transform="translate(10, 10)">
    <!-- Background circle -->
    <circle cx="30" cy="30" r="30" fill="#2563EB"/>
    
    <!-- Data flow lines - representing pipelines and movement -->
    <path d="M15 30 L25 20 L35 30 L45 20" stroke="white" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M15 35 L25 25 L35 35 L45 25" stroke="#10B981" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
    <path d="M15 40 L25 30 L35 40 L45 30" stroke="white" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>
    
    <!-- Connection nodes -->
    <circle cx="15" cy="30" r="3" fill="white"/>
    <circle cx="25" cy="20" r="3" fill="#10B981"/>
    <circle cx="35" cy="30" r="3" fill="white"/>
    <circle cx="45" cy="20" r="3" fill="#10B981"/>
    
    <circle cx="15" cy="35" r="3" fill="white" opacity="0.8"/>
    <circle cx="25" cy="25" r="3" fill="#10B981" opacity="0.8"/>
    <circle cx="35" cy="35" r="3" fill="white" opacity="0.8"/>
    <circle cx="45" cy="25" r="3" fill="#10B981" opacity="0.8"/>
    
    <circle cx="15" cy="40" r="3" fill="white" opacity="0.6"/>
    <circle cx="25" cy="30" r="3" fill="#10B981" opacity="0.6"/>
    <circle cx="35" cy="40" r="3" fill="white" opacity="0.6"/>
    <circle cx="45" cy="30" r="3" fill="#10B981" opacity="0.6"/>
  </g>
  
  <!-- Wordmark -->
  <text x="80" y="52" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="32" font-weight="600" fill="#334155" letter-spacing="-0.5">
    Artha<tspan fill="#2563EB">Flow</tspan>
  </text>
</svg>
